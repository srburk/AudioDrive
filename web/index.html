<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioDrive — URLs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      background: #f5f5f5;
      color: #222;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #111;
    }

    .form-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    input[type="url"] {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus { border-color: #555; }

    button {
      padding: 0.5rem 1.1rem;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #444; }
    button:disabled { background: #999; cursor: default; }

    .msg {
      font-size: 0.875rem;
      min-height: 1.25em;
      margin-bottom: 1.5rem;
    }

    .msg.error { color: #c0392b; }
    .msg.ok    { color: #27ae60; }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .item {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 0.9rem 1rem;
    }

    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.3rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 0.1rem;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .delete-btn:hover { color: #c0392b; background: none; }

    .item-title {
      font-weight: 600;
      font-size: 0.97rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .item-desc {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 0.6rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-foot {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .item-url {
      font-size: 0.8rem;
      color: #999;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }

    .item-url:hover { color: #555; text-decoration: underline; }

    .item-date {
      font-size: 0.8rem;
      color: #bbb;
      white-space: nowrap;
      margin-left: auto;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: capitalize;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-pending    { background: #e8e8e8; color: #555; }
    .badge-processing { background: #fff3cd; color: #7d5a00; }
    .badge-done       { background: #d4edda; color: #155724; }
    .badge-failed     { background: #f8d7da; color: #721c24; }

    .download-btn {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      background: #e8e8e8;
      color: #333;
      border-radius: 6px;
      font-size: 0.8rem;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .download-btn:hover { background: #d8d8d8; }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Saved URLs</h1>

    <div class="form-row">
      <input id="urlInput" type="url" placeholder="https://example.com" autocomplete="off">
      <button id="submitBtn">Save</button>
    </div>
    <div id="msg" class="msg"></div>

    <div id="itemList" class="item-list"></div>
  </div>

  <script>
    const input    = document.getElementById('urlInput');
    const btn      = document.getElementById('submitBtn');
    const msg      = document.getElementById('msg');
    const itemList = document.getElementById('itemList');

    function setMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + (type || '');
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function sanitizeFilename(s) {
      const cleaned = s.toLowerCase().replace(/[^a-z0-9\s-]/g, '');
      const result = cleaned.trim().replace(/\s+/g, '-');
      return result.slice(0, 100) || s;
    }

    function renderItems(urls) {
      if (!urls.length) {
        itemList.innerHTML = '<div class="empty">No URLs saved yet.</div>';
        return;
      }
      itemList.innerHTML = urls.map(u => {
        const title = u.title || u.url;
        const badgeCls = 'badge badge-' + (u.status || 'pending');
        const descHtml = u.description
          ? `<p class="item-desc">${escapeHtml(u.description)}</p>`
          : '';
        const ext = u.audio_path ? u.audio_path.split('.').pop() : 'mp3';
        const dlName = sanitizeFilename(u.title || String(u.id)) + '.' + ext;
        const dlBtn = u.audio_path
          ? `<a class="download-btn" href="/audio/${u.id}" download="${escapeHtml(dlName)}">⬇ mp3</a>`
          : '';
        return `
          <div class="item">
            <div class="item-top">
              <span class="item-title">${escapeHtml(title)}</span>
              <div style="display:flex;align-items:center;gap:0.4rem;flex-shrink:0">
                <span class="${badgeCls}">${escapeHtml(u.status || 'pending')}</span>
                <button class="delete-btn" data-id="${u.id}" title="Delete">×</button>
              </div>
            </div>
            ${descHtml}
            <div class="item-foot">
              <a class="item-url" href="${escapeHtml(u.url)}" target="_blank" rel="noopener">${escapeHtml(u.url)}</a>
              <span class="item-date">${formatDate(u.created_at)}</span>
              ${dlBtn}
            </div>
          </div>`;
      }).join('');
    }

    async function loadURLs() {
      try {
        const res = await fetch('/urls');
        if (!res.ok) throw new Error('Failed to load URLs');
        const data = await res.json();
        renderItems(data);
      } catch (e) {
        setMsg('Could not load URLs: ' + e.message, 'error');
      }
    }

    async function saveURL() {
      const raw = input.value.trim();
      if (!raw) { setMsg('Enter a URL.', 'error'); return; }

      btn.disabled = true;
      setMsg('');

      try {
        const res = await fetch('/urls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: raw })
        });
        const data = await res.json();
        if (!res.ok) {
          setMsg(data.error || 'Error saving URL.', 'error');
          return;
        }
        setMsg('Saved!', 'ok');
        input.value = '';
        await loadURLs();
      } catch (e) {
        setMsg('Network error: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    let pollTimer = null;

    function startPolling() {
      if (pollTimer !== null) return;
      pollTimer = setInterval(() => {
        if (document.visibilityState === 'visible') loadURLs();
      }, 3000);
    }

    function stopPolling() {
      if (pollTimer !== null) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadURLs();
        startPolling();
      } else {
        stopPolling();
      }
    });

    itemList.addEventListener('click', async e => {
      const del = e.target.closest('.delete-btn');
      if (!del) return;
      const id = del.dataset.id;
      del.disabled = true;
      try {
        const res = await fetch(`/urls/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          setMsg(data.error || 'Delete failed.', 'error');
          del.disabled = false;
          return;
        }
        await loadURLs();
      } catch (e) {
        setMsg('Network error: ' + e.message, 'error');
        del.disabled = false;
      }
    });

    btn.addEventListener('click', saveURL);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') saveURL(); });

    loadURLs();
    startPolling();
  </script>
</body>
</html>
