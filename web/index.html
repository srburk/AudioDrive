<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioDrive — URLs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      background: #f5f5f5;
      color: #222;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #111;
    }

    .form-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    input[type="url"] {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus { border-color: #555; }

    button {
      padding: 0.5rem 1.1rem;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #444; }
    button:disabled { background: #999; cursor: default; }

    .msg {
      font-size: 0.875rem;
      min-height: 1.25em;
      margin-bottom: 1.5rem;
    }

    .msg.error { color: #c0392b; }
    .msg.ok    { color: #27ae60; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    thead th {
      text-align: left;
      padding: 0.6rem 1rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      border-bottom: 1px solid #e8e8e8;
      background: #fafafa;
    }

    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 0.65rem 1rem;
      vertical-align: middle;
    }

    .id-cell { color: #999; font-size: 0.85rem; width: 4rem; }

    .url-cell a {
      color: #1a6fdb;
      text-decoration: none;
      word-break: break-all;
    }

    .url-cell a:hover { text-decoration: underline; }

    .date-cell {
      color: #888;
      font-size: 0.83rem;
      white-space: nowrap;
    }

    .status-cell { width: 7rem; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: capitalize;
    }

    .badge-pending    { background: #e8e8e8; color: #555; }
    .badge-processing { background: #fff3cd; color: #7d5a00; }
    .badge-done       { background: #d4edda; color: #155724; }
    .badge-failed     { background: #f8d7da; color: #721c24; }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }

    .download-btn {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      background: #e8e8e8;
      color: #333;
      border-radius: 6px;
      font-size: 0.8rem;
      text-decoration: none;
      white-space: nowrap;
    }

    .download-btn:hover { background: #d8d8d8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Saved URLs</h1>

    <div class="form-row">
      <input id="urlInput" type="url" placeholder="https://example.com" autocomplete="off">
      <button id="submitBtn">Save</button>
    </div>
    <div id="msg" class="msg"></div>

    <table id="urlTable">
      <thead>
        <tr>
          <th class="id-cell">ID</th>
          <th class="status-cell">Status</th>
          <th>URL</th>
          <th class="date-cell">Saved</th>
          <th>Audio</th>
        </tr>
      </thead>
      <tbody id="urlBody"></tbody>
    </table>
  </div>

  <script>
    const input = document.getElementById('urlInput');
    const btn   = document.getElementById('submitBtn');
    const msg   = document.getElementById('msg');
    const tbody = document.getElementById('urlBody');

    function setMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + (type || '');
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function statusBadge(status) {
      const cls = 'badge badge-' + (status || 'pending');
      return `<span class="${cls}">${escapeHtml(status || 'pending')}</span>`;
    }

    function renderRows(urls) {
      if (!urls.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty">No URLs saved yet.</div></td></tr>';
        return;
      }
      tbody.innerHTML = urls.map(u => `
        <tr>
          <td class="id-cell">${u.id}</td>
          <td class="status-cell">${statusBadge(u.status)}</td>
          <td class="url-cell">
            <a href="${escapeHtml(u.url)}" target="_blank" rel="noopener">${escapeHtml(u.url)}</a>
          </td>
          <td class="date-cell">${formatDate(u.created_at)}</td>
          <td>${u.audio_path ? `<a class="download-btn" href="/audio/${u.id}" download="${u.id}.${u.audio_path.split('.').pop()}">Download</a>` : ''}</td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadURLs() {
      try {
        const res = await fetch('/urls');
        if (!res.ok) throw new Error('Failed to load URLs');
        const data = await res.json();
        renderRows(data);
      } catch (e) {
        setMsg('Could not load URLs: ' + e.message, 'error');
      }
    }

    async function saveURL() {
      const raw = input.value.trim();
      if (!raw) { setMsg('Enter a URL.', 'error'); return; }

      btn.disabled = true;
      setMsg('');

      try {
        const res = await fetch('/urls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: raw })
        });
        const data = await res.json();
        if (!res.ok) {
          setMsg(data.error || 'Error saving URL.', 'error');
          return;
        }
        setMsg('Saved!', 'ok');
        input.value = '';
        await loadURLs();
      } catch (e) {
        setMsg('Network error: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    let pollTimer = null;

    function startPolling() {
      if (pollTimer !== null) return;
      pollTimer = setInterval(() => {
        if (document.visibilityState === 'visible') loadURLs();
      }, 3000);
    }

    function stopPolling() {
      if (pollTimer !== null) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadURLs();
        startPolling();
      } else {
        stopPolling();
      }
    });

    btn.addEventListener('click', saveURL);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') saveURL(); });

    loadURLs();
    startPolling();
  </script>
</body>
</html>
