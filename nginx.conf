server {
    listen 80;
    server_name your-machine.tail-xxxx.ts.net;

    # Proxy API routes to the Go service
    location /urls {
        proxy_pass http://localhost:8080;
    }

    location /audio/ {
        proxy_pass http://localhost:8080;
    }

    # Serve the static UI
    location / {
        root ./web;
        try_files $uri $uri/ =404;
    }
}
